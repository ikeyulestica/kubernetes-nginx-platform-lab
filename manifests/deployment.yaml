apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: nginx-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-deployment
  template:
    metadata:
      labels:
        app: nginx-deployment
    spec:
      containers:
        - name: nginx
          image: nginx
          volumeMounts:
            - name: nginx-html-volume
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: nginx-html-volume
          configMap:
            name: nginx-html-config